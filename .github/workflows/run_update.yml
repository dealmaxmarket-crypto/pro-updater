name: Лента обновлений Run Prom

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Код оформления заказа
        uses: actions/checkout@v4

      - name: Настройка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Установите зависимости
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl requests

      - name: Запустить скрипт
        run: python update.py

      - name: Сохранить файл в репозиторий
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --soft origin/main
          git add prom_update_feed.xml
          git commit -m "Автоматическое обновление файла prom_update_feed.xml" || exit 0
          git push origin main --force
